<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- Title -->
  <rect x="300" y="12" width="500" height="42" rx="8" fill="#2563eb"/>
  <text x="550" y="40" text-anchor="middle" fill="white" font-size="18" font-weight="bold">图 1  系统总体架构图</text>

  <!-- Layer 1: 表示层 -->
  <rect x="40" y="75" width="1020" height="115" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="65" y="100" fill="#1e40af" font-size="14" font-weight="bold">表示层（微信小程序前端）</text>
  <rect x="70" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="142" y="140" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">问答交互页面</text>
  <text x="142" y="158" text-anchor="middle" fill="#6b7280" font-size="10">自然语言输入/结果展示</text>
  <rect x="235" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="307" y="140" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">信息展示页面</text>
  <text x="307" y="158" text-anchor="middle" fill="#6b7280" font-size="10">报到/地图/交通/费用</text>
  <rect x="400" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="472" y="140" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">食堂/景点页面</text>
  <text x="472" y="158" text-anchor="middle" fill="#6b7280" font-size="10">菜品推荐/周边导览</text>
  <rect x="565" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="637" y="140" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">个人中心</text>
  <text x="637" y="158" text-anchor="middle" fill="#6b7280" font-size="10">认证状态/历史记录</text>
  <rect x="730" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="802" y="140" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">评价反馈页面</text>
  <text x="802" y="158" text-anchor="middle" fill="#6b7280" font-size="10">评分/评价/统计面板</text>
  <rect x="895" y="115" width="145" height="55" rx="6" fill="white" stroke="#60a5fa"/>
  <text x="967" y="142" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">三种用户角色</text>
  <text x="967" y="160" text-anchor="middle" fill="#6b7280" font-size="10">新生/在校生/管理员</text>

  <!-- Arrow 1→2 -->
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>
  <line x1="550" y1="190" x2="550" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="575" y="207" fill="#6b7280" font-size="10">HTTPS / RESTful API</text>

  <!-- Layer 2: 接口层 -->
  <rect x="40" y="215" width="1020" height="100" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="65" y="240" fill="#166534" font-size="14" font-weight="bold">接口层（Node.js + Express/Koa）</text>
  <rect x="70" y="255" width="150" height="50" rx="6" fill="white" stroke="#4ade80"/>
  <text x="145" y="278" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">请求路由</text>
  <text x="145" y="293" text-anchor="middle" fill="#6b7280" font-size="10">参数校验/权限鉴权</text>
  <rect x="240" y="255" width="150" height="50" rx="6" fill="white" stroke="#4ade80"/>
  <text x="315" y="278" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">身份鉴权</text>
  <text x="315" y="293" text-anchor="middle" fill="#6b7280" font-size="10">Token验证/RBAC</text>
  <rect x="410" y="255" width="170" height="50" rx="6" fill="white" stroke="#4ade80"/>
  <text x="495" y="278" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">消息队列投递</text>
  <text x="495" y="293" text-anchor="middle" fill="#6b7280" font-size="10">RabbitMQ异步调度</text>
  <rect x="600" y="255" width="150" height="50" rx="6" fill="white" stroke="#4ade80"/>
  <text x="675" y="278" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">缓存查询</text>
  <text x="675" y="293" text-anchor="middle" fill="#6b7280" font-size="10">Redis优先命中</text>
  <rect x="770" y="255" width="150" height="50" rx="6" fill="white" stroke="#4ade80"/>
  <text x="845" y="278" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">响应封装</text>
  <text x="845" y="293" text-anchor="middle" fill="#6b7280" font-size="10">JSON格式返回</text>

  <!-- Arrow 2→3 -->
  <line x1="300" y1="315" x2="300" y2="345" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="800" y1="315" x2="800" y2="345" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="330" y="335" fill="#6b7280" font-size="10">业务调用</text>
  <text x="830" y="335" fill="#6b7280" font-size="10">消息消费</text>

  <!-- Layer 3: 业务逻辑层 -->
  <rect x="40" y="345" width="1020" height="160" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="65" y="370" fill="#854d0e" font-size="14" font-weight="bold">业务逻辑层</text>
  <rect x="70" y="385" width="155" height="50" rx="6" fill="white" stroke="#facc15"/>
  <text x="147" y="408" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">问答引擎服务</text>
  <text x="147" y="423" text-anchor="middle" fill="#6b7280" font-size="10">知识图谱查询/语义匹配</text>
  <rect x="245" y="385" width="155" height="50" rx="6" fill="white" stroke="#facc15"/>
  <text x="322" y="408" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">知识图谱管理</text>
  <text x="322" y="423" text-anchor="middle" fill="#6b7280" font-size="10">实体/关系增删改查</text>
  <rect x="420" y="385" width="155" height="50" rx="6" fill="white" stroke="#facc15"/>
  <text x="497" y="408" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">用户与认证服务</text>
  <text x="497" y="423" text-anchor="middle" fill="#6b7280" font-size="10">注册/登录/学号认证</text>
  <rect x="595" y="385" width="155" height="50" rx="6" fill="white" stroke="#facc15"/>
  <text x="672" y="408" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">内容审核服务</text>
  <text x="672" y="423" text-anchor="middle" fill="#6b7280" font-size="10">审核队列/状态流转</text>
  <rect x="770" y="385" width="155" height="50" rx="6" fill="white" stroke="#facc15"/>
  <text x="847" y="408" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">通知服务</text>
  <text x="847" y="423" text-anchor="middle" fill="#6b7280" font-size="10">微信订阅消息推送</text>
  <rect x="70" y="450" width="155" height="40" rx="6" fill="white" stroke="#facc15"/>
  <text x="147" y="475" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">反馈与统计服务</text>
  <rect x="420" y="450" width="505" height="40" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="672" y="475" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">大语言模型推理服务（独立部署）— 意图识别 / 实体抽取 / 检索优化 — 通过RabbitMQ异步解耦</text>

  <!-- Arrow 3→4 -->
  <line x1="50" y1="505" x2="50" y2="540" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Layer 4: 数据层 -->
  <rect x="40" y="540" width="1020" height="130" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="65" y="565" fill="#9d174d" font-size="14" font-weight="bold">数据层</text>
  <rect x="70" y="580" width="190" height="75" rx="8" fill="white" stroke="#f472b6"/>
  <text x="165" y="605" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">MySQL</text>
  <text x="165" y="622" text-anchor="middle" fill="#6b7280" font-size="10">用户/问答/审核/反馈</text>
  <text x="165" y="637" text-anchor="middle" fill="#6b7280" font-size="10">交通路线/费用标准</text>
  <text x="165" y="649" text-anchor="middle" fill="#6b7280" font-size="10">结构化业务数据</text>
  <rect x="290" y="580" width="190" height="75" rx="8" fill="white" stroke="#f472b6"/>
  <text x="385" y="605" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">Neo4j</text>
  <text x="385" y="622" text-anchor="middle" fill="#6b7280" font-size="10">知识图谱三元组存储</text>
  <text x="385" y="637" text-anchor="middle" fill="#6b7280" font-size="10">实体-关系-属性</text>
  <text x="385" y="649" text-anchor="middle" fill="#6b7280" font-size="10">Cypher语义查询</text>
  <rect x="510" y="580" width="190" height="75" rx="8" fill="white" stroke="#f472b6"/>
  <text x="605" y="605" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">Redis</text>
  <text x="605" y="622" text-anchor="middle" fill="#6b7280" font-size="10">高频问答对缓存</text>
  <text x="605" y="637" text-anchor="middle" fill="#6b7280" font-size="10">热点数据预加载</text>
  <text x="605" y="649" text-anchor="middle" fill="#6b7280" font-size="10">毫秒级读写响应</text>
  <rect x="730" y="580" width="190" height="75" rx="8" fill="white" stroke="#f472b6"/>
  <text x="825" y="605" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">RabbitMQ</text>
  <text x="825" y="622" text-anchor="middle" fill="#6b7280" font-size="10">接口层 ↔ 推理服务</text>
  <text x="825" y="637" text-anchor="middle" fill="#6b7280" font-size="10">异步解耦/削峰填谷</text>
  <text x="825" y="649" text-anchor="middle" fill="#6b7280" font-size="10">请求调度与负载均衡</text>

  <!-- Channel boxes -->
  <rect x="70" y="700" width="480" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="722" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">通道一：知识图谱语义检索（自动应答）</text>
  <text x="310" y="740" text-anchor="middle" fill="#6b7280" font-size="10">用户提问 → 意图识别 → 知识图谱查询 → 缓存/返回 → 结果展示</text>
  <rect x="560" y="700" width="480" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="800" y="722" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">通道二：在校学生众包回答（人工应答）</text>
  <text x="800" y="740" text-anchor="middle" fill="#6b7280" font-size="10">未匹配 → 推送学生 → 审核入库 → 通知用户 → 知识库扩充</text>
  <rect x="440" y="770" width="220" height="30" rx="6" fill="#2563eb"/>
  <text x="550" y="790" text-anchor="middle" fill="white" font-size="12" font-weight="bold">双通道路由：基于置信度阈值</text>
</svg>
